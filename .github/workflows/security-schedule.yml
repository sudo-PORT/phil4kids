name: Scheduled security scan

on:
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read
  issues: write

concurrency:
  group: scheduled-security-${{ github.repository }}
  cancel-in-progress: false

jobs:
  security:
    name: Weekly full scan
    uses: sudo-PORT/.github/.github/workflows/node-ci.yml@85309710779b018037666a12b301cfa9dd24d6b6
    with:
      quality-enabled: false
      gitleaks-enabled: true
      semgrep-enabled: true
      trivy-enabled: true
      security-runner-class: github-hosted
      security-enforce: true

  triage:
    name: Weekly issue triage
    if: always()
    needs: security
    uses: sudo-PORT/.github/.github/workflows/security-triage.yml@85309710779b018037666a12b301cfa9dd24d6b6
    with:
      security-result: ${{ needs.security.result }}
      security-enforce: true
