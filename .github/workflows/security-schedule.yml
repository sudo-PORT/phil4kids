name: Scheduled security scan

on:
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  issues: write

concurrency:
  group: scheduled-security-${{ github.repository }}
  cancel-in-progress: false

jobs:
  security:
    name: Weekly full scan
    uses: sudo-PORT/.github/.github/workflows/node-ci.yml@89bb4b85b117bd266c9e8feb5e7c931cb3a44c1a
    with:
      quality-enabled: false
      gitleaks-enabled: true
      semgrep-enabled: true
      trivy-enabled: true
      security-enforce: false
      security-issues-enabled: true
