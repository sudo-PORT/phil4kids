name: Scheduled security scan

on:
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read
  issues: write

concurrency:
  group: scheduled-security-${{ github.repository }}
  cancel-in-progress: false

jobs:
  security:
    name: Weekly full scan
    uses: sudo-PORT/.github/.github/workflows/node-ci.yml@3c0e63976ba46cb4220b11788fd6004e3c00d02f
    with:
      quality-enabled: false
      gitleaks-enabled: true
      semgrep-enabled: true
      trivy-enabled: true
      security-enforce: false

  triage:
    name: Weekly issue triage
    if: always()
    needs: security
    uses: sudo-PORT/.github/.github/workflows/security-triage.yml@3c0e63976ba46cb4220b11788fd6004e3c00d02f
    with:
      security-result: ${{ needs.security.result }}
      security-enforce: false
