<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">Phil4Kids</title>
  <desc id="description">Webauftritt für Kindermusik, Bewegung und spielerische Gesundheitsförderung.</desc>
  <defs>
    <style>
      .flow-line { stroke-dasharray: 18 12; animation: flow 10s linear infinite; }
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 3.2s ease-in-out infinite; }
      .delay-one { animation-delay: -1.1s; }
      .delay-two { animation-delay: -2.2s; }
      @keyframes flow { to { stroke-dashoffset: -120; } }
      @keyframes pulse { 0%, 100% { transform: scale(1); opacity: .72; } 50% { transform: scale(1.32); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .flow-line, .pulse { animation: none; } }
    </style>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="420" rx="28" fill="#080b10"/>
  <rect x="22" y="22" width="1156" height="376" rx="22" fill="#101720" stroke="#243041"/>
  <rect x="22" y="22" width="10" height="376" rx="5" fill="url(#accent)"/>
  <rect x="22" y="22" width="1156" height="376" rx="22" fill="url(#glow)"/>
  <g opacity="0.7" fill="none" stroke="#7c3aed">
    <path class="flow-line" d="M890 82h88l44 52h84"/>
    <path class="flow-line" d="M842 154h98l54 62h112" opacity="0.6"/>
    <path class="flow-line" d="M914 278h70l38-44h84" opacity="0.42"/>
    <circle class="pulse" cx="890" cy="82" r="6" fill="#7c3aed"/>
    <circle class="pulse delay-one" cx="1106" cy="134" r="8" fill="#ec4899"/>
    <circle class="pulse delay-two" cx="842" cy="154" r="5" fill="#7c3aed"/>
    <circle class="pulse" cx="1106" cy="216" r="6" fill="#7c3aed"/>
    <circle class="pulse delay-one" cx="914" cy="278" r="5" fill="#ec4899"/>
  </g>
  <text x="86" y="98" fill="#9aa7b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="2.4">KUNDENPROJEKT</text>
  <text x="86" y="184" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="760" letter-spacing="-1.5">Phil4Kids</text>
  <text x="86" y="242" fill="#9aa7b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26"><tspan x="86" dy="0">Webauftritt für Kindermusik, Bewegung und spielerische</tspan><tspan x="86" dy="34">Gesundheitsförderung.</tspan></text>
  <g transform="translate(86 332)">
    <rect width="330" height="44" rx="22" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-opacity="0.55"/>
    <circle class="pulse" cx="24" cy="22" r="6" fill="#7c3aed"/>
    <text x="42" y="29" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="650">Webauftritt in Entwicklung</text>
  </g>
</svg>